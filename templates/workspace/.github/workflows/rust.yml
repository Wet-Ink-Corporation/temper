# The same gate the agents run (H-15), enforced for every push and PR.
name: rust
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny   # Cargo 1.97+ build.warnings (MOD-13)

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --doc --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"      # keep in sync with workspace.package.rust-version
      # Cargo < 1.97 silently ignores build.warnings, so deny warnings the old way here.
      - run: cargo check --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings
