<script id="md" type="text/markdown"># temper: status-quo audit against vision, v1 plan and 2.0 port plan

- **Date:** 2026-10-06
- **Subject:** `Wet-Ink-Corporation/temper` at `d87d887` (= `origin/main`, plugin version 1.3.0), read-only clone
- **Pilots:** `weigh-in` (main) and `redkiln-rs` (main, plus the adoption branch `build/phase-0-to-1`), both read-only clones
- **Isolation:** the audit ran entirely in the session scratchpad. It did not modify `/home/user/temper` or the branch checked out there.
- **Method:** 14 audit dimensions, each producing evidence-cited findings. A second verifier pass re-checked every finding, re-running greps, probes and `gh api` calls. **199 findings survived verification. 2 were refuted and dropped** (see section 10). Status vocabulary: done | partial | not-started | regressed | stale-doc | risk | quality-issue.

---

## 1. Executive overview

temper is **feature-complete for 1.x and is in real use**. Every capability promised in the README and in `plugin.json` exists in code, and most of them were driven by hand during the audit. The deterministic CI is fully green at `d87d887`: 156 unit tests (155 pass, 1 Windows-only skip), 182 rules with 2,757 citations checked, 0 of 329 doc examples failing, and the brownfield e2e passing in 27 s (`ci.log`, final line `== all checks passed`, `EXIT 0`). 1.3.0 shipped through the gated release workflow. Both pilots run temper 1.3.0, byte-identical to `scripts/`, with a CI gate and a committed baseline. weigh-in has already paid its whole lint baseline down to zero.

**v1 is not "live" yet, and the gap is mostly verification, bookkeeping and time rather than engineering:**

1. **The protection claims are not true in GitHub.** temper's own `main` ruleset requires no CI status checks. weigh-in's ruleset does not require the temper `gate` job. redkiln-rs's adoption branch has no rules at all. AGENTS.md, CONTRIBUTING.md, the plan and the comment that closed #14 all say otherwise (`gh api .../rulesets/24368200`, `.../weigh-in/rulesets/24377415`, `.../redkiln-rs/rulesets/24430583`). These are owner-only edits of a few minutes each.
2. **The pilot soak has just started.** Adoption merged 2026-10-03/04, and the plan requires at least two weeks of daily use. The earliest honest exit is about **2026-10-17**. No telemetry, gate-latency or false-positive data has been captured yet (#15 has no comments).
3. **The go-live checklist (#20) has 0 of 9 boxes ticked.** In substance 4 items are met, 2 are not met, and 3 are partial or unverified.

**Quality gaps worth closing before v1 and before the 2.0 parity harness freezes behaviour:**
- The headline "completion gate + fingerprint-bound review" paths (Stop, SubagentStop, verdict validation, SessionStart, the skill-gate deny) have **no deterministic tests**. They are covered only by paid model-call smoke runs and evals. One evals.md sentence claims unit coverage that does not exist.
- **Shell writes can forge review and gate state**, edit protected config, or switch the Stop gate off by breaking `rust-toolchain.toml`. The README labels the shell layer "heuristic", but it does not say that review state is writable from the shell. CI remains the hard backstop for the gate, but nothing outside the session re-checks the independent review.

**The 2.0 Rust port has not started, which is intended.** It is gated on v1 going live. The plan is complete and all 17 decisions plus the licence are settled. It has drifted from 1.3.0 in specific places (test counts, the setup features, `LEGACY_TEMPLATES`, macOS) and carries two new risks. Realistic size: about 26k lines, roughly 6 to 10 weeks elapsed once started, bounded by a single owner's review bandwidth.

**Overall grade: B.** The engineering is strong, the evidence is honest, and the remaining v1 work is small. Two things pull the grade down: enforcement settings that were claimed but are not real, and validation (pilot data, orchestration tests, cost model) that has not caught up with the features.

## 4. Quality scorecard

| Dimension | Grade | Rationale |
|---|---|---|
| Product promise | B | Every promised capability exists and behaves as documented under hand probes. The headline completion-gate and review paths lack deterministic tests. Shell can forge state. Real-world validation is 2-3 days old |
| The rust-craft standard | B+ (reported B) | 182 rules, 2,757 citations, 0/329 failing examples, sources and licences recorded. 86 rules (31 of them MUST) are review-only. Evals cite 3 rule IDs. 31 Don't blocks have no `expect=`. The rubric names 72 of 182 IDs |
| Enforcement engine | B | Zero-dependency Node, 90-105 ms hooks, linear scanner (13k lines in 64 ms), deliberate Windows handling, earlier security findings fixed and tested. Gaps: the anti-bypass shell layer, untested orchestration handlers, unbounded state growth |
| Workflow surface (commands, agents, templates, evals) | B | All 5 commands and 3 agents match the README. Evals meet target. Nothing evaluates `/temper:implement`, `/temper:setup`, `/temper:audit` or the architect and implementer. #48 is not done |
| Release and CI | B | The release workflow shipped 1.3.0 behind approval. SHA pins and Dependabot are in place. Pre-release model checks are manual. One cancelled main run and one rerun are unexplained. macOS CI is parked |
| v1 plan execution | B | Phases 0, 1 and 3 are delivered. The required-check claims are false. The plan and tracking issues lag reality in both directions |
| Pilots | C | Adoption is real and healthy, and weigh-in remediated 721→0. But the soak is not elapsed, there is no telemetry or latency data, findings are bundled, and redkiln-rs is off main |
| 2.0 port readiness | B | Plan and decisions are excellent, and the external prerequisites are mostly done. The plan has drifted from 1.3.0 and misses two new risks. No dates |
| Docs and governance | B | CHANGELOG, version, decisions and troubleshooting are all aligned. Tracking issue bodies are stale (#6, #7, #20, #23) |
| Closure of history findings | A | About 30 of the 1.1/1.2 review findings were spot-checked and none was silently dropped. Residuals: vendored-CLI integrity (item 27), nested workspaces, 7 drifted anchors |
| Security, privacy, licensing | B | Least-privilege, SHA-pinned workflows. Telemetry is local-only. MIT is consistent. Telemetry is undisclosed and unbounded, SECURITY.md is thin, and the vendored copy has no integrity check |
| Fresh-adopter experience | B | Greenfield and upgrade both reach green. There is no greenfield path in the docs, the empty-workspace error is raw rustfmt help, `.gitignore` is incomplete, and the Node and Claude Code minimums are not checked |
| Runtime cost and context budget | C | Hooks are cheap. The standard costs about 4.4k tokens up front plus 9-22k per reference, and a review round costs about 25-30k. None of this is documented or budgeted. Stop-gate latency on a large repo was never measured. Budget alerts are not set |
| Backlog and open decisions | B | 12 open issues all map to plan steps. All 21 decisions are accepted. There are no priority labels or milestones, and the bodies are stale |

## 6. Remaining effort roll-up

### 6.1 To "v1 live": about 3-5 working days of effort over about 2 calendar weeks

The critical path is the pilot soak. Ordered:

1. **Owner, S (minutes each):** add required status checks `Checks` and `Unit tests (Windows)` to temper's `Protect main` ruleset; add `gate` to weigh-in's ruleset; protect redkiln-rs `build/phase-0-to-1` with `temper` required, or record explicitly that a build-branch gate satisfies item 3.
2. **Agent + owner, M, elapsed to about 2026-10-17:** run the soak; file one `pilot` issue per finding with a severity; capture `temper stats` from each pilot and a measured cold and warm Stop-gate time on redkiln-rs.
3. **Agent, M:** fix the findings; decide or re-scope wi-a9eb36; land #48 (final report restates declined requests).
4. **Owner decision, S:** is v1 the existing 1.3.0, or a 1.3.x / 1.4.0 cut after the fixes?
5. **If a new release, agent + owner, S-M:** release PR, smoke run, discriminating eval run (owner approves about $9-12), Release workflow, merge commit.
6. **Owner, S:** one other org member dry-runs the install; send the announcement; create P0/P1 labels or reword item 4; tick #20 and close #6.
7. **Agent, S:** refresh the plan document and issue bodies (#6, #7, #19, #20, #23); fix README drift (2.1.289, SubagentHandback, internal and support line).

### 6.2 Recommended 1.x hardening before the parity harness freezes behaviour: about 4-6 working days

- Deterministic tests for Stop/completionGate, SubagentStop, `validateVerdict`/`extractVerdict`, SessionStart sources, the skill-gate deny and the loop breaker (M). These also serve as the 2.0 parity oracle.
- preBash deny for shell writes to the state dir and to `config.protected` globs; treat "cargo unusable after a toolchain edit" as red (S).
- `copies: true` for `.rs` shell writes; quote-blanking for the `--no-verify` and `-A` checks (S).
- Tighten verdict validation: path-component match, a minimum number of integer scores (S).
- Prune or cap telemetry, gate cache and logs; disclose telemetry in the README (S).
- Greenfield quick start, empty-workspace message, `.gitignore` additions, drift message pointing to `--vendor-only` (S).
- Decide on `SubagentHandback` (owner, S).

### 6.3 To 2.0: XL, about 6-10 weeks elapsed after v1

Pre-port: #22 fold-in (M), #23 owner setup (S-M), #24 tiered CI (M-L). Then phases 0a-8: about 26k lines added and about 14k deleted. Binding constraints are owner review and approval bandwidth, owner-only registry and environment setup, and the Actions budget. Before Phase 0a, rebase the plan to 1.3.x: test counts, setup features, `LEGACY_TEMPLATES`, the macOS criterion, org-sync and cloud install paths, and the patch-release policy.

## 8. Risks

| Risk | Impact | Mitigation |
|---|---|---|
| Required checks are not enforced on temper or the pilots, while docs claim they are | A red PR could merge to `main`, which is what marketplace users install. The pilot gate is advisory | Owner adds the checks (minutes). Add a CI or scripted ruleset assertion |
| Review and gate state forgeable via shell; config and toolchain edits disable the Stop gate | The "independent review" guarantee is trust-based. A confused or adversarial agent can end a turn "approved" | preBash state-dir and protected-glob rules; treat a broken toolchain as red; consider HMAC'd state |
| Headline orchestration paths untested deterministically | A regression in Stop, verdict or loop-breaker logic ships green. The 2.0 parity harness lacks an oracle | Write Node unit tests now |
| Pilot soak yields little data (no telemetry export, no latency measurement) | v1 declared without evidence that daily use is tolerable; false-positive rate unknown | Make `temper stats` capture and Stop-gate timing explicit deliverables of #15 |
| Stop gate exceeds the 1200 s hook budget on large repos (redkiln-rs) | The hook is killed and the turn ends unenforced, with orphaned cargo processes | Measure. Document expected times. Bound gate steps to the hook budget |
| Thin eval margin (+0.42 vs +0.4) and only 3 rule IDs exercised | A new release could miss the target; most rules are behaviourally unproven | Full rerun after the #47 swap; add orchestration evals over time |
| Context and token cost undocumented (~4.4k up front, 25-30k per review round) | Adopters surprised by cost; no regression guard on standard growth | Document the cost; add a size budget test for SKILL.md and the rubric |
| Single-owner bus factor (merges, approvals, crates.io, releases) | Delays or a blocked release if the owner is unavailable | Second admin for registries; document the delegation path |
| 2.0 port scale and gaps (regex parity, npm optionalDependencies, org-sync/cloud install paths not planned) | Multi-week effort could stall or regress users | Strangler approach keeps users on 1.x. Rebase the plan; spike distribution in Phase 0b |
| Unexplained CI cancellation (run 69) and slow reruns | A flaky required check erodes trust once checks are actually required | Open an issue; inspect run logs; record minutes per run |

22", "title": "Enforcement outside Claude Code Code is lint plus CI only, and that boundary is clearly stated", "plan_ref": "README.md 'Using the standard with other agents'; troubleshooting claude.ai chat", "status": "done", "severity": "info", "detail": "The README says layers 1 and 9 apply to every agent and every human, while layers 3 to 8 are Claude Code-specific. Troubleshooting says claude.ai chat loads skills but ignores hooks and agents, and explains why cloud sessions need a setup-script install and how the organization sync works. This is honest scoping, which is a strength. The practical limitation for the product promise is that, in Claude Code cloud sessions, the plugin is absent unless the environment is configured, so the 'whether or not they decide to' promise only holds when installed there.", "evidence": ["README.md:168-170", "docs/troubleshooting.md:27-43"], "remaining_effort": "none", "owner_only": false}, {"dim": "standard", "id": "standard-1-1", "title": "Rule registry complete: 182 rules, counts consistent everywhere", "plan_ref": "v1-readiness.md row 'The standard'; README; AGENTS.md", "status": "done", "severity": "info", "detail": "rules.md has 182 rule rows (95 MUST, 78 SHOULD, 9 CONSIDER); tests/registry.py reports 182 rules with a section and 2757 citations checked; the claimed number 182 matches in README.md:5, AGENTS.md:16 and docs/plans/v1-readiness.md:21. Every cited ID exists.", "evidence": ["ci.log: '== rule registry 182 rules; 182 with a section; 2757 citations checked; 1 stated count(s).'", "182 rule rows counted in skills/rust-craft/references/rules.md", "rulemap.json rules dict length 182"], "remaining_effort": "none", "owner_only": false}, {"dim": "standard", "id": "standard-1-2", "title": "Every code example in the standard is compiled and linted; zero failures", "plan_ref": "AGENTS.md 'Code in the standard is tested'", "status": "done", "severity": "info", "detail": "doc_examples.py compiled 165 Do blocks and 42 Don't block ng the Enforced by column of rules.md: 96 of 182 rules name lint, scan, hook/gate or cargo deny/Miri; 86 are review-only. This is by design and labelled honestly, but almost half of the standard depends on the LLM reviewer agent catching violations. Combined with thin eval coverage (standard-1-7), that part is least verified.", "evidence": ["Counts from parsing skills/rust-craft/references/rules.md: review-only 86, lint-only 39, scan-only 22, lint+scan 19, hook-only 9, other mixes 9"], "remaining_effort": "XL", "owner_only": false}, {"dim": "standard", "id": "standard-1-6", "title": "31 MUST rules are enforced by review alone", "plan_ref": "rules.md MUST level", "status": "risk", "severity": "medium", "detail": "MUST means blocks merge, yet 31 MUST rules have no tool behind them: API-03, API-04, API-17, ERR-03, ERR-08, ARC-02, ARC-03, ARC-05, ARC-08, ARC-16, TST-01, TST-02, TST-09, TST-16, PERF-01, PERF-10, ASY-01, ASY-05, ASY-08, ASY-17, OUT-02 to OUT-05, CRF-11, PROC-01, PROC-04, PROC-06, PROC-07, PROC-09, PROC-11. Merge-blocking depends on the reviewer verdict, not the gate. Some (ARC-02 layer direction) look scannable from the crate graph; most are inherently judgemental.", "evidence": ["Parsed rules.md rows where level=MUST and Enforced by names none of lint/scan/hook/gate/cargo deny/Miri (31 rows)"], "remaining_effort": "L", "owner_only": false}, {"dim": "standard", "id": "standard-1-7", "title": "Evals cite only 3 of 182 rule IDs; most rules have no model-behaviour test", "plan_ref": "v1-readiness 1.1; issue #47", "status": "partial", "severity": "low", "detail": "Eight eval cases exist and the five discriminating ones met the target (+0.55, +0.44, +0.42). Grepping evals for rule IDs finds 3 distinct IDs. Open issue #47 notes a case the plain model already passes was replaced (PR #53). Breadth across ownership, API and output families is thin. Acceptable for v1; coverage is the remaining quality question.", "evidence": ["evals/ directories: adds-function-unde doc", "severity": "info", "detail": "The plan states 2754 citations; the CI run shows 2757. The 329 blocks and 182 rules agree. Trivial, but hard-coded numbers that registry.py already computes will drift again.", "evidence": ["docs/plans/v1-readiness.md:21 '2754 citations'", "ci.log '2757 citations checked'"], "remaining_effort": "S", "owner_only": false}, {"dim": "standard", "id": "standard-1-11", "title": "31 Don't blocks lack an expect= annotation, so their claimed diagnostic is unchecked", "plan_ref": "AGENTS.md: Don't blocks must fire the diagnostic they claim", "status": "partial", "severity": "low", "detail": "doc_examples reports 31 ignored Don't blocks without expect= (reported, not failing) across 10 reference files. 76 other ignored blocks carry expect=. AGENTS.md says Don't blocks must fire the claimed diagnostic; these 31 are not verified. One Do block carries an #[expect] scanner 'ask' hit (escape-hatches.md:428).", "evidence": ["ci.log: 'Don't blocks without expect= (reported, not failing): 31'", "ci.log: 'rust,ignore (expect=) 76, rust,ignore (no expect=) 31'"], "remaining_effort": "M", "owner_only": false}, {"dim": "standard", "id": "standard-1-12", "title": "Three scanner keys are not named in any test or standard text", "plan_ref": "scripts/lib/rulemap.json scan keys", "status": "risk", "severity": "low", "detail": "Of 56 scanner keys, 15 are not named in tests/*.test.mjs; for catch-unwind, path-attr and todo-comment a grep of tests/ and skills/rust-craft finds no mention at all. They may still be exercised by pattern through fixtures; I did not run them individually. Worth confirming each scan rule has a positive and a negative test.", "evidence": ["Script: scan keys absent from tests/*.test.mjs: async-trait, catch-unwind, deref-inherit, downcast, env-var, global-mut, lazy-static, leak, path-attr, shared-mut, should-panic, sleep, todo-comment, unbounded, weak-assert", "grep for catch-unwind, path-attr, todo-comment in tests and skills/rust-craft ss.md:22 '~5.6k lines of dependency-free Node across 13 modules. 8 hook events.'"], "remaining_effort": "none", "owner_only": false}, {"dim": "engine", "id": "engine-1-2", "title": "Deterministic engine CI is green: 156 unit tests across 8 test files", "plan_ref": "AGENTS.md Commands (tests/ci.sh)", "status": "done", "severity": "info", "detail": "The 2026-10-06 CI run in the audit clone passed all 156 tests (155 pass, 1 skipped as Windows-only). Module-to-test mapping: scan.mjs + lexer.mjs -> scan.test.mjs (32 tests). baseline.mjs + gate.mjs ratchet + project.mjs fingerprint/safeOutputPath + the CLI via spawnSync -> baseline.test.mjs (31). hooks.mjs preEdit/preBash (manifest rules, shell writes, baseline raise, git restore, cargo add) + gate.mjs checkManifests -> hooks.test.mjs (33). findings.mjs -> findings.test.mjs (15). report.mjs -> report.test.mjs (19). toml.mjs + manifest.mjs -> toml.test.mjs (7). vendor.mjs -> vendor.test.mjs (6). The release-check script has 13 tests. Tests that need cargo or git run on Linux CI (only one skip).", "evidence": ["scratchpad/ci.log:941-946 (# tests 156, # pass 155, # fail 0, # skipped 1)", "scratchpad/ci.log:41 (only skip: 'relTo ... 8.3 short name ... # SKIP Windows only')", "grep of imports in tests/*.test.mjs (module mapping above)"], "remaining_effort": "none", "owner_only": false}, {"dim": "engine", "id": "engine-1-3", "title": "Windows handling is deliberate and CI-verified", "plan_ref": "v1-readiness 0.9 runner probe; docs/troubleshooting.md#windows", "status": "done", "severity": "info", "detail": "Hooks launch node directly, without a shell. Verbatim paths (\\\\?\\C:) are normalised, and 8.3 short names and symlinked ancestors are resolved through realpath. Child processes use windowsHide. CRLF manifests are handled and tested. The plugin root is derived with drive-letter handling. A Windows unit-test job is a required check. The runner probe found and fixed a macOS path bug in the CLI (#26).", "evidence": ["scripts/lib/project.mjs:136-165 (unverbatim, longPath, relTo)", "scripts/lib/project.mjs:14 (windowsHide: true)", "scripts/lib/hooks.mjs:25 (drive-letter handling in pluginRoot)", "tests/hooks.test.mjs:215 'CRLF manifests are handled'", "AGENTS.md: required checks 'Checks' and 'Unit tests (Windows)'; .github/workflows/ci.yml:45-62 windows job runs node --test", "evidence-github.md sec 4: runner probe run 1 failed, fixed in PR #26, run 2 green"], "remaining_effort": "none", "owner_only": false}, {"dim": "engine", "id": "engine-1-4", "title": "Hook and scanner performance is good; gate results are cached per tree fingerprint", "plan_ref": "vision (hooks must not slow the session)", "status": "done", "severity": "info", "detail": "I timed the CLI end to end on a scratch repo: pre-bash 102 ms, pre-edit (with a scan and a deny) 94 ms, user-prompt 90 ms. scanSource on the largest pilot file (redkiln-rs spikes/runner/src/main.rs, 3,366 lines) took 21 ms, and the same file repeated 4x (13,461 lines) took 64 ms, so cost grows roughly linearly. The gate caches results by a sha256 fingerprint of HEAD, the base and the Rust-relevant diff, and ratchet mode writes cargo JSON to a temp file instead of a pipe buffer, which handles large brownfield output.", "evidence": ["engine-probe/perf.mjs output: 'main.rs x4 13461 lines 64 ms 780 hits'", "hook timing loop: 'pre-bash 102 ms', 'pre-edit 94 ms', 'user-prompt 90 ms'", "scripts/lib/gate.mjs:200-208 (fingerprint cache)", "scripts/lib/findings.mjs:405-420 (runToFile)"], "remaining_effort": "none", "owner_only": false}, {"dim": "engine", "id": "engine-1-5", "title": "Earlier security review findings in the engine are fixed and regression-tested", "plan_ref": "docs/history/1.2-baseline-and-report/review.md #9; docs/history/1.1-resource-review/review-machinery.md #12", "status": "done", "severity": "info", "detail": "`--findings-out`/`report --out` used to be an arbitrary-file-write primitive, and the first fix could be bypassed through a symlinked parent. safeOutputPath now resolves every ancestor through realpath, refuses `..` and symlinks, and restricts output to target/ or .temper/. `cargo add/remove` used to bypass the dependency ask. preBash now asks, and shell writes to Cargo.toml, Cargo.lock, the baseline file and the vendored CLI are denied, each with tests.", "evidence": ["scripts/lib/project.mjs:226-255 (safeOutputPath)", "scripts/lib/hooks.mjs:413-427, 477-485 (cargoDependencyCommands ask)", "tests/hooks.test.mjs:239, 264, 273, 462, 484", "docs/history/1.2-baseline-and-report/review.md:82 (symlinked-parent bypass that the current code closes)"], "remaining_effort": "none", "owner_only": false}, {"dim": "engine", "id": "engine-1-6", "title": "Engine state (review verdicts, gate cache) can be forged with a shell write; the Stop hook trusts it", "plan_ref": "README.md:19-21 layers 6-8 (anti-bypass, completion gate, independent review)", "status": "risk", "severity": "medium", "detail": "Verdicts are stored at .git/temper/verdicts/<fp>.json and gate results at .git/temper/gate/<fp>.json. preEdit denies Edit/Write under the state dir (hooks.mjs:236-239), but preBash has no rule for it. Probe: `echo '{\"verdict\":\"approved\"}' > .git/temper/verdicts/<fp>.json` and `cp /tmp/v.json .git/temper/gate/<fp>.json` both return no decision. completionGate runs runGate, which returns a cached JSON for the fingerprint without re-running anything after fmt (gate.mjs:203-207), and then accepts any cached verdict whose verdict is 'approved' (hooks.mjs:580-581). An agent that writes these two files with the current fingerprint (shown by `temper status`) ends the turn as 'gate green and review approved' with neither having run. CI re-runs the gate, but nothing outside the session re-checks the independent review. This takes deliberate adversarial behaviour, but it defeats the property the README presents as 'Yes, deterministic'. Fix options: deny shell writes whose target matches .git/temper or the state dir in preBash; sign or HMAC state records with a per-session secret kept outside the repo; or re-validate the verdict JSON against verdict.mjs at Stop.", "evidence": ["engine-probe/probe.mjs output: \"none  | echo '{\\\"verdict\\\":\\\"approved\\\"}' > .git/temper/verdicts/0123456789abcdef.json\"", "engine-probe/probe.mjs output: 'none  | cp /tmp/v.json .git/temper/gate/0123456789abcdef.json'", "scripts/lib/project.mjs:69-72 (stateDir = <git-common-dir>/temper)", "scripts/lib/gate.mjs:203-207 (cached result returned)", "scripts/lib/hooks.mjs:580-581 (verdictFor accepted)", "scripts/lib/hooks.mjs:429-490 (preBash: no state-dir rule)"], "remaining_effort": "S", "owner_only": false}, {"dim": "engine", "id": "engine-1-7", "title": "Shell writes to protected config are not guarded, and breaking the toolchain file turns the Stop gate into a pass-through", "plan_ref": "README.md:18-19 layers 5-6 (human gates, anti-bypass)", "status": "risk", "severity": "medium", "detail": "Edits to protected config through Edit/Write ask the human: .claude/temper.json returned 'ask' in the probe. Shell writes to the same files return no decision: `> .claude/temper.json`, `> .claude/settings.json`, `>> clippy.toml`, `> rust-toolchain.toml`. SHELL_WRITE_VENDORED needs `.claude/temper/` with a trailing slash, so temper.json, where review:'off' or skillGate:false live, is outside it. Second, the gate treats an unusable cargo as UNAVAILABLE, not red (gate.mjs:179-190). completionGate then returns a notice and allows the stop (hooks.mjs:561-564). I confirmed that a rust-toolchain.toml naming a toolchain that is not installed makes `cargo --version` exit 1, so one unguarded shell write turns off the Stop-hook gate for that turn. CI still catches the toolchain change. Fix: extend preBash shellWrites to config.protected globs, and either treat 'cargo unusable after a change to rust-toolchain*' as red or ask on it.", "evidence": ["engine-probe/probe.mjs output: \"none  | echo '{\\\"review\\\":\\\"off\\\"}' > .claude/temper.json\", 'none  | echo x > rust-toolchain.toml', 'none  | echo \"[lints]\" >> clippy.toml'", "engine-probe/probe.mjs output: 'preEdit .claude/temper.json: ask'", "scripts/lib/hooks.mjs:349-353 (shellWrites only for .rs, Cargo.lock, Cargo.toml, baseline, .claude/temper/)", "scratch repo: rust-toolchain.toml channel 'nonexistent-9.9' -> 'cargo --version' exit=1", "scripts/lib/gate.mjs:179-190; scripts/lib/hooks.mjs:561-564"], "remaining_effort": "S", "owner_only": false}, {"dim": "engine", "id": "engine-1-8", "title": "cp/mv/git apply/patch of .rs files skip the pre-write scanner and the #[expect] human ask", "plan_ref": "README.md:18-19 layers 4-6", "status": "risk", "severity": "low", "detail": "SHELL_WRITE_RS is built without `copies: true`, while the Cargo.lock/toml/baseline patterns have it. So `cp /tmp/x.rs src/main.rs`, `mv`, `git apply` and `patch -p1` return no decision. Only redirects, tee, sed -i, perl -i and python open() are caught. The gate re-scans changed files at Stop (gate.mjs:211-221), so hard escape hatches are still caught later. A new `#[expect(lint, reason)]` arriving this way never triggers the human ask at edit time, and at the gate 'ask' hits do not fail (gate.mjs:214); they are only listed. The README marks this layer 'heuristic for shell', so this is a documented limitation, but cp/mv are trivially common.", "evidence": ["engine-probe/probe.mjs output: 'none  | cp /tmp/evil.rs src/main.rs', 'none  | mv /tmp/evil.rs src/main.rs', 'none  | git apply /tmp/p.diff', 'none  | patch -p1 < /tmp/p.diff'", "scripts/lib/hooks.mjs:349 (SHELL_WRITE_RS without copies) vs 350-353", "scripts/lib/gate.mjs:214-218 (only hard hits fail the gate scan)"], "remaining_effort": "S", "owner_only": false}, {"dim": "engine", "id": "engine-1-9", "title": "Hook orchestration paths have no deterministic tests (Stop/completion gate, verdict validation, SessionStart, SubagentStart/Stop, skill gate)", "plan_ref": "docs/plans/temper-2-rust-port.md parity tests; v1-readiness 3.3", "status": "quality-issue", "severity": "medium", "detail": "No test file references validateVerdict, extractVerdict, sessionStart, userPromptSubmit, postTool, preHandback, stop, subagentStop or subagentStart. hooks.test.mjs:76 says the skill gate 'is not under test here'. These are the paths that decide whether a turn may end (the loop breaker, Status: WIP/BLOCKED parsing, the stale-verdict flag, the advisory/off review modes). They are exercised only by tests/e2e/smoke.sh and the evals, which make model calls and are not part of the required CI. A regression in parseStatus, the stuck() loop breaker or validateVerdict would ship green. The 2.0 port plan depends on byte-parity tests of exactly these handlers, so writing them now in Node gives the port its oracle too.", "evidence": ["grep over tests/*.test.mjs and tests/e2e/*: no match for validateVerdict, extractVerdict, subagentStop, subagentStart, sessionStart, userPromptSubmit, postTool, preHandback, completionGate", "tests/hooks.test.mjs:76 '// A preloaded agent type skips the skill gate, which is not under test here.'", "scripts/lib/hooks.mjs:534-621 (parseStatus, completionGate, stop, subagentStop)", "scripts/lib/verdict.mjs:1-91 (no unit test)"], "remaining_effort": "M", "owner_only": false}, {"dim": "engine", "id": "engine-1-10", "title": "Gate latency vs the 1200 s Stop-hook budget has never been measured on a pilot", "plan_ref": "docs/plans/v1-readiness.md:116 (2.3 collect findings: gate latency on the Stop hook); issue #15", "status": "not-started", "severity": "low-medium", "detail": "Each cargo step may take up to gate.stepTimeoutSec = 900 s (project.mjs:89). The Stop and SubagentStop hooks allow 1200 s (hooks.json). With clippy, tests, doctests and doc in sequence, a cold large workspace can overrun the hook. The hook then gets killed, nothing is cached, and the turn ends unenforced (troubleshooting.md:131). The risk is documented with mitigations, but plan item 2.3 asks for the ga ner_only": false}, {"dim": "engine", "id": "engine-1-12", "title": "Verdict validation accepts degenerate evidence: suffix matching on files_read, and an all-'n/a' approval", "plan_ref": "README.md:21 layer 8 (verdict validated: unread changed files are refused)", "status": "quality-issue", "severity": "low", "detail": "The 'changed files not reviewed' check matches with `r.endsWith(f) || f.endsWith(r)` (verdict.mjs:55-58), so files_read: [\"s\"] or [\"lib.rs\"] counts as reading every changed .rs file that ends with that suffix. Every score may be 'n/a', and the >=3 rule only applies to integer scores (verdict.mjs:64). With no cached gate for the fingerprint, the red-gate check is skipped. Probe: an 'approved' verdict with every score 'n/a' and files_read ['s'] against two changed files validates with []. The Stop hook still requires its own green gate, so the exposure is the quality of review evidence, not the gate. Fix: require path-component matches and at least N applicable integer scores.", "evidence": ["scripts/lib/verdict.mjs:55-59 (suffix match)", "scripts/lib/verdict.mjs:64 (n/a skips the >=3 rule)", "engine-probe/verdict.mjs output: \"all n/a, files_read=[\\\"s\\\"]: []\""], "remaining_effort": "S", "owner_only": false}, {"dim": "engine", "id": "engine-1-13", "title": "PreToolUse SubagentHandback hook is dead code on supported Claude Code versions", "plan_ref": "v1-readiness 1.2 (#9); docs/history/evals.md:262-265", "status": "partial", "severity": "low", "detail": "hooks.json registers a PreToolUse matcher 'SubagentHandback' that runs preHandback. Smoke runs on 2.1.286, 2.1.288 and 2.1.289 show it never fires. SubagentStop does the same validation, so nothing is lost. Whether to remove it is recorded as an open owner question, because the 2.0 port plan carries parity tests for pre-handback. Removing it, or keeping it with a note, is a quick decision.", "evidence": ["hooks/hooks.json:33 '\"matcher\": \"SubagentHandback\"'", "docs/history/evals.md:262 '| P ly": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-2", "title": "No documented greenfield path; README and setup skill only describe brownfield adoption", "plan_ref": "README Install / Brownfield adoption", "status": "partial", "severity": "low", "detail": "grep for greenfield, cargo new and cargo init in README.md, skills/setup/SKILL.md and docs/*.md finds nothing. A new project user must infer: run setup, create crates under crates/, add `[lints] workspace = true`, write docs and #[must_use] to pass. The README's rollout is entirely brownfield (fmt commit, baseline, audit). Brownfield e2e and two pilot adoptions are tested; a greenfield e2e is not.", "evidence": ["grep -n -i 'greenfield|new project|cargo new|cargo init' README.md skills/setup/SKILL.md docs/*.md -> no matches", "templates/ holds workspace, crate, example-workspace only; no 'starter crate'"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-3", "title": "Fresh setup yields a gate-red repo with an empty workspace, and the failure message is raw rustfmt help text", "plan_ref": "templates/workspace/Cargo.toml; scripts/lib/gate.mjs:192-198", "status": "quality-issue", "severity": "low", "detail": "The template Cargo.toml declares `members = [\"crates/*\"]`, which matches nothing in an empty repo. `cargo metadata` and `cargo fmt` then fail: 'failed to load manifest for workspace member .../crates/*'. `temper gate` prints 'fmt FAILED' followed by the whole `cargo fmt --help` text, and `baseline --check` prints 'FAIL ... 1 compile error(s)'. A first-time user sees a red gate with no actionable cause. The gate summarizer does not detect a missing-member manifest error and tell the user to create a crate.", "evidence": ["greenfield-probe/gate1.txt: 'temper gate: RED (fingerprint n/a) / fmt FAILED / --- fmt --- Use verbose output ...'", "`temper baseline --check` -> 'cargo metadata --no-deps failed (exit 101): failed to load manifest for workspace member .../crates/*'", "scripts/lib/gate.mjs:195-198"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-4", "title": "Stock `cargo new --lib` crate fails the gate on first run (docs, must_use, arithmetic)", "plan_ref": "templates/workspace/Cargo.toml lint table", "status": "risk", "severity": "low", "detail": "The cargo-new lib (add with `left + right`) failed clippy with 3 errors: must_use_candidate, missing crate docs and missing function docs. It is working as designed (strict standard), but a new user gets no pointer to a starter crate or to the rule IDs before hitting it. Cargo new also auto-adds `[lints] workspace = true` when run in the workspace, which is good, and appending it again (as the SKILL step 3 tells people to do for members) produces a duplicate-key manifest error that the gate reports as an unhelpful 'fmt FAILED'.", "evidence": ["greenfield-probe/gate3.txt: 'crates/hello/src/lib.rs:1:8: error: this function could have a #[must_use] attribute / missing documentation for the crate / missing documentation for a function'", "gate2.txt: 'error: duplicate key --> crates/hello/Cargo.toml:14:2 [lints]'"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-5", "title": ".gitignore gets only .temper/; target/ and Cargo.lock show as untracked after the first gate run", "plan_ref": "scripts/temper.mjs:416-419", "status": "quality-issue", "severity": "low", "detail": "setup appends only `.temper/`. In a repo with no .gitignore, running the gate leaves target/ and Cargo.lock untracked (git status showed `?? Cargo.lock`, `?? target/`). A user running `git add -A` would commit target/. cargo new --vcs none adds no ignore either. Cargo.lock is also protected (PROC-13), so it should be committed, but target/ should be ignored.", "evidence": ["green/.gitignore contains only '.temper/'", "up/ `git status --short` -> '?? Cargo.lock / ?? target/'", "scripts/temper.mjs:416-419 appends only .temper/"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-6", "title": "Upgrade 1.2.3 to 1.3.0 via the README steps works; --vendor-only and --force both verified", "plan_ref": "README Upgrading; CHANGELOG 1.3.0; issue #10", "status": "done", "severity": "info", "detail": "I installed v1.2.3 (commit a485408) setup in a temp repo (gate green, VERSION 1.2.3), then ran the new CLI. `setup --dry-run` printed the `drift  .claude/temper/ differs from temper 1.3.0 (the copy says 1.2.3): temper.mjs (changed), lib/project.mjs (changed), VERSION (changed); rerun with --force` line exactly as the README quotes it. `--vendor-only --dry-run` and `--vendor-only` updated only those 3 files, VERSION became 1.3.0, and gate and baseline --check stayed green. `--force` printed 16 `update` lines but git status showed only .claude/temper/*, .github/workflows/rust.yml and AGENTS.md modified, matching the CHANGELOG's 'Upgrading from 1.2.x'. After the refresh the dry-run no longer reports drift. The README step 4 text and the CHANGELOG note are accurate.", "evidence": ["up/: `setup --vendor-only` -> 'update .claude/temper/ to temper 1.3.0: temper.mjs (changed), lib/project.mjs (changed), VERSION (changed)'", "`git diff --stat a485408 d87d887 -- templates/workspace scripts`: project.mjs, temper.mjs, rust.yml, AGENTS.md", "CHANGELOG.md 1.3.0 'Upgrading from 1.2.x'"], "remaining_effort": "none", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-7", "title": "Drift message recommends --force, README recommends --vendor-only; unmodified templates keep raising 'manual' lines", "plan_ref": "README Upgrading step 3-4", "status": "quality-issue", "severity": "low", "detail": "The drift line ends 'rerun with --force to replace it', which also overwrites every template file. The safer `--vendor-only` is not mentioned in the message. Separately, after the upgrade the dry-run still prints `manual .github/workflows/rust.yml:65,80,95,176,203` and `manual AGENTS.md:21,23` about -D warnings for the pristine template files (those are template-intended and baseline-aware), so a correct upgrade never reaches a clean dry-run. `setup` also cannot tell whether a skipped template file differs from the template (README says so), so template drift (e.g. the 1.3.0 msrv job change) is found only by manual diff.", "evidence": ["up/ `setup --dry-run` after --vendor-only: 'manual .github/workflows/rust.yml:65,80,95,176,203 ...' and 'manual AGENTS.md:21,23 ...'", "README.md line 126-129", "`skip ... (exists; compare with ...)` lines for all 15 template files"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-8", "title": "Node and Claude Code minimum versions are documented but never checked", "plan_ref": "README Install requirements; issue #9 (PR #30)", "status": "partial", "severity": "low", "detail": "README states Claude Code >= 2.1.286 and Node >= 18, and docs/troubleshooting.md says that with node missing Claude Code gives a non-blocking hook error and 'nothing is enforced'. grep of scripts/ and hooks/ finds no process.version check, no `engines` field, and plugin.json has no minimum-version field. On Node 16 the CLI would fail on syntax or API errors, and hooks fail open. On an older Claude Code the hooks silently do not run. A fresh adopter on a stale install gets no clear error. AGENTS.md says contributors need Node 22+, so the 18 floor is also not exercised by the test matrix I could see.", "evidence": ["grep -rn -i 'process.version|engines|minNode|2.1.286' scripts hooks .claude-plugin -> only README and docs hits, none in code", "README.md Install: 'Claude Code 2.1.286 or later ... Node 18 or later'", "docs/troubleshooting.md line 22"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-fresh-adopter-experience", "id": "gap-fresh-adopter-experience-2-9", "title": "Time to first green is short but step count is high and partly implicit", "plan_ref": "README Install; skills/setup/SKILL.md", "status": "partial", "severity": "low", "detail": "Steps for a new Rust user: (1) install the plugin (2 commands), (2) run /temper:setup or the CLI, (3) approve the manifest merge (existing Cargo.toml) or create crates, (4) add `[lints] workspace = true` and satisfy docs and must_use, (5) git hooksPath, charters, cargo machete before the first push. The CLI portion measured under 1 s plus about 1 minute for the first cargo build; total estimated 5 to 15 minutes. Rust toolchain 1.98.1 is pinned via rust-toolchain.toml, so rustup auto-installs it on first cargo call (not exercised here, the toolchain was present). Charters need the model.", "evidence": ["`time node .claude/temper/temper.mjs gate --no-cache` real 0m0.839s on the failing run; green runs cached per fingerprint", "setup output 'Next: give every crate a charter ... Before the first push, run cargo machete'"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-1", "title": "Hook-injected context is small and bounded (done)", "plan_ref": "vision", "status": "done", "severity": "info", "detail": "SessionStart additionalContext measured 3,109 bytes (about 780 tokens) on the example workspace, built from fixed text plus one state line. UserPromptSubmit nudge is 292 bytes and fires only while the skill is unloaded (returns none() otherwise). SubagentStart is 664 bytes for the implementer; the reviewer adds a diff stat capped at 25 lines and at most 40 changed-file names. PreToolUse advisories are capped at 8 items.", "evidence": ["scripts/lib/hooks.mjs:70-100 (session-start text)", "scripts/lib/hooks.mjs:106-110 (user-prompt, early none())", "scripts/lib/hooks.mjs:628-650 (subagent-start; slice(0,40), slice(-25))", "scripts/lib/hooks.mjs:323 (advice.slice(0,8))", "measured: session-start out 3109 bytes, user-prompt 292, pre-edit 1495, subagent-start 664"], "remaining_effort": "none", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-2", "title": "Hook latency is low per call (done)", "plan_ref": "vision", "status": "done", "severity": "info", "detail": "Timed with sample JSON on stdin against templates/example-workspace: session-start 168-183 ms, user-prompt 97 ms, pre-edit 90 ms, pre-bash 94 ms, post-tool 105 ms, subagent-start 184 ms, stop (no Rust changes) 160 ms. These are mostly Node start-up. Matchers narrow PreToolUse to Write|Edit|MultiEdit and Bash, PostToolUse to Skill|Read, and SubagentStart to the three agents, so Grep/Glob and other tools pay nothing.", "evidence": ["hooks/hooks.json:4-66 (matchers and timeouts)", "command: for each hook, echo JSON | node scripts/temper.mjs hook <event>, timed with date +%s%N"], "remaining_effort": "none", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-3", "title": "Standard loads 4.4k tokens up front and 10-22k more per task; not documented or budgeted", "plan_ref": "vision", "status": "risk", "severity": "low", "detail": "skills/rust-craft/SKILL.md is 17,428 bytes (about 4.4k tokens) loaded whenever the skill is loaded, and the hooks refuse Rust edits until it is, so every Rust session pays it. SKILL.md tells the agent to read the matching reference before starting: references are 36-90 KB each (patterns.md 89.6 KB is about 22k tokens; ownership 49 KB about 12k; testing 48.8 KB about 12k). A typical task (SKILL + one or two references) is therefore about 15-30k tokens, and a task touching API design plus errors plus testing can reach 40k+. The full set of references is about 700 KB (about 175k tokens), so reading all of them would not fit a normal window. No size budget, token estimate or size-regression test exists, and README and AGENTS.md never state the cost. Rules.md is meant to be grepped, not read (SKILL.md:128), which is good practice, but nothing enforces it.", "evidence": ["wc -c skills/rust-craft/SKILL.md = 17428; references/*.md sizes 10-90 KB (patterns 89652, api-design 67524, async 62077, architecture 60359)", "skills/rust-craft/SKILL.md:128-140 (read-the-matching-reference table)", "grep for 'token|overhead|context cost' in README.md and docs/plans/*.md found no cost statement"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-4", "title": "Review round adds roughly 25-30k tokens before the diff", "plan_ref": "vision", "status": "risk", "severity": "low", "detail": "A reviewer subagent loads its own prompt (rust-reviewer.md 3,634 bytes, about 0.9k tokens), the rust-craft skill (4.4k tokens), the review rubric (16,589 bytes, about 4.1k tokens) and SubagentStart context (about 0.2k tokens), plus the rules and the diff. That is about 10k tokens of fixed overhead, and about 25-30k if it also loads a topic reference. The implementer prompt is 3,464 bytes and the architect 2,465 bytes. Each Stop that finds a stale or missing verdict can trigger another review round, so a multi-round fix loop multiplies this. The reviewer runs in a separate context so it does not pollute the main window, but it is billed. Cost per review round is not recorded; the only per-run figures are eval totals ($0.26-$0.36 for the 11-13 turn smoke session).", "evidence": ["wc -c agents/*.md: 2465, 3464, 3634; references/review-rubric.md 16589", "docs/history/evals.md:236-248 (smoke: 11-12 turns, $0.26-$0.36 per session)", "scripts/lib/hooks.mjs:600-617 (verdict invalid blocks and forces a rewrite)"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-5", "title": "SessionStart re-injects on resume, clear, compact and fork", "plan_ref": "vision", "status": "done", "severity": "info", "detail": "The SessionStart matcher is startup|resume|clear|compact|fork, so the 3.1 KB block is re-added at each compaction and resume. About 780 tokens each time is minor, but a long session that compacts repeatedly pays it repeatedly. This is probably intended (the guidance has to survive compaction), but it is not stated as a cost anywhere.", "evidence": ["hooks/hooks.json:6", "scripts/lib/hooks.mjs:75 CLAUDE_ENV_FILE written each time"], "remaining_effort": "none", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-6", "title": "Stop-gate latency on a real workspace not measured or documented", "plan_ref": "vision", "status": "partial", "severity": "medium", "detail": "The Stop hook runs fmt, scan, manifest check, clippy, tests and rustdoc, cached per tree fingerprint, with a 1200 s timeout (SubagentStop too). With no Rust changes it returns in 160 ms (measured). A cold gate on a real workspace costs a full cargo build plus tests; only the probe's 59-102 s example-workspace figure (plan 0.9) and the 27 s brownfield e2e exist, and no document gives user-facing cold or warm gate time. The plan itself notes the gate is not bounded to the hook budget and can leave orphaned cargo processes when Claude Code kills a timed-out hook, deferred as a 2.x follow-up. A pilot like redkiln-rs (baseline 6,606 findings) could hit the 20-minute ceiling, and that is unmeasured.", "evidence": ["hooks/hooks.json:59,66 timeout 1200", "docs/plans/temper-2-rust-port.md:158 and :846 (gate not bounded to hook budget; orphaned cargo processes)", "docs/plans/v1-readiness.md:94 (probe timings 36-102 s cold on example workspace)", "../ci.log:1042 brownfield e2e 27s"], "remaining_effort": "M", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-7", "title": "Eval cost is well recorded but uncapped and per-run owner approval only", "plan_ref": "v1-readiness 1.1 / 3.3", "status": "done", "severity": "info", "detail": "docs/history/evals.md records time, cost, runs, judge and CC version for each run: full 8-case suite $7.58 (1669 s, haiku judge), $9.72 (2248 s, sonnet judge, plus about $1 probes), $8.98 (1939 s, confirming run); one-case reruns $0.99 and $0.53; smoke runs $0.26-$0.36; early runs $1.86-$2.08. Roughly $30-35 total across history. Each paid run is explicitly owner-approved. No cap or per-release eval budget is written down, and the pre-release check (3.3, #19, still open) would add about $9 plus a smoke run per minor release.", "evidence": ["docs/history/evals.md:36,49,87,100,130,167,205,217,236-248", "issue #19 open"], "remaining_effort": "S", "owner_only": true}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-8", "title": "Actions budget alerts (plan 0.9) still not set; issue #7 open", "plan_ref": "v1-readiness 0.9", "status": "not-started (unconfirmed: billing settings unreadable; probe half done)", "severity": "medium", "detail": "The plan calls for an Actions budget with alerts at 75% and 90% in enterprise billing settings. The probe half is done (run 2 green), but the owner item is still open and the plan text itself says 'Owner: set the budget alerts'. Billing settings are not readable with the tools available, so it cannot be confirmed whether alerts exist, but the open issue and the plan status indicate they do not. Port-era tiered CI (#24) is also open. The plan's own estimate of 120-180 included minutes per full-matrix PR run and 300-500 per release is untested.", "evidence": ["docs/plans/v1-readiness.md:94,155", "issue #7 OPEN (evidence-github.md line 10)", "issues #24 and #23 open"], "remaining_effort": "S", "owner_only": true}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-9", "title": "Current CI minutes per run bounded by timeouts but not recorded; hang seen", "plan_ref": "v1-readiness 0.9", "status": "risk", "severity": "low", "detail": "ci.yml has two jobs: Checks on ubuntu-latest (timeout 60 min) and Unit tests on windows-latest (timeout 30 min, billed at 2x). A concurrency group cancels superseded runs (runs 50, 55, 56 cancelled). Run 69 on main had both jobs cancelled after about 15 min, so a hang rather than a test failure, and run 70 needed a second attempt and took about 53 min wall clock. Hangs bill until cancelled, so worst case is 60 + 30x2 = 120 billable-equivalent minutes per run, against a normal local CI time of a few minutes (ci.log shows doc examples 33 s, brownfield 27 s). No document records minutes per run, and macOS is parked. Cause of the run 69 hang is not diagnosed or recorded.", "evidence": [".github/workflows/ci.yml:12 (concurrency), :19-20 (60 min), :46-48 (windows, 30 min)", "evidence-github.md lines 46-47 (run 69 cancelled after ~15 min; run 70 attempt 2 about 53 min)", "https://github.com/Wet-Ink-Corporation/temper/actions/runs/37367980815"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-context-budget-2-10", "title": "telemetry.jsonl has no size cap or rotation", "plan_ref": "vision", "status": "quality-issue", "severity": "low", "detail": "Every denied edit, ask, verdict, skill load and session start appends a JSON line to telemetry.jsonl under the project state dir, with no rotation or truncation. Sessions are pruned at 14 days and markers are pruned, but the telemetry log is not, so it grows unbounded in a long-lived repository. Each line is small (about 150 bytes), so this is a slow leak and not an incident. It is also not documented that it is written.", "evidence": ["scripts/lib/project.mjs:303-310 (appendFileSync, no limit)", "scripts/lib/project.mjs:292-300 (pruneSessions only handles sessions dir)"], "remaining_effort": "S", "owner_only": false}, {"dim": "gap-runtime-cost-context-budget", "id": "gap-runtime-cost-contex
