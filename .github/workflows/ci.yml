name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The toolchain templates/workspace/rust-toolchain.toml pins; the doc examples
      # and the brownfield e2e build under it.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Plugin and marketplace manifests
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .
      - name: Checks (tests/ci.sh)
        run: bash tests/ci.sh

  # The CLI and hooks run on Windows too: path separators, verbatim (\\?\) paths
  # from cargo, and symlink rights differ there.
  windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Unit tests
        shell: bash
        run: node --test tests/*.test.mjs
