name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A PR's runs share one group, and a newer push cancels the older run. Every
# other run (a push to main) gets a group of its own, so GitHub neither cancels
# it nor drops it from the queue as superseded: each merge commit runs in full.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The toolchain templates/workspace/rust-toolchain.toml and
      # templates/example-workspace/rust-toolchain.toml pin; the doc examples, the
      # brownfield e2e and the example workspace gate build under it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Plugin and marketplace manifests
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .
      # The lens's plugin tests and its read-only allow-list (#110), on the same pinned CLI,
      # and a strict type check of the lens against tests/lens-types/ (wi-78d987).
      - name: temper lens
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE: npx --yes @anthropic-ai/claude-code@2.1.286
          TSC: npx --yes -p typescript@7.0.2 tsc
        run: bash tests/lens-check.sh
      - name: Checks (tests/ci.sh)
        run: bash tests/ci.sh

  # The CLI and hooks run on Windows too: path separators, verbatim (\\?\) paths
  # from cargo, and symlink rights differ there.
  windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Unit tests
        shell: bash
        run: node --test tests/*.test.mjs
      # The reference workspace ships to users; its store must work on Windows too
      # (append-mode handles there cannot truncate, which the crash repair needs).
      - name: Example workspace tests
        shell: bash
        working-directory: templates/example-workspace
        run: cargo test --locked --workspace

  # The 2.0 port's workspace (docs/plans/temper-2-rust-port.md, Phase 0a): the rust-craft gate
  # on Linux, Windows and macOS (wi-e85ef8). Users still run the Node engine until the cutover.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_WARNINGS: deny   # Cargo 1.97+ build.warnings (MOD-13)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Licence copies in each crate
        run: cargo xtask check-licenses
      # Feature unification can hide a member that does not build alone (ARC-16).
      - name: Each member builds on its own
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cargo metadata --locked --no-deps --format-version 1
          | jq -r '.packages[].name'
          | xargs -I{} cargo check --locked --all-targets -p {}
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - name: Supply chain (cargo deny)
        if: runner.os == 'Linux'
        run: cargo deny --locked check

  # The workspace builds on its minimum supported Rust (D4, the workspace's rust-version).
  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-28
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check on 1.96
        run: cargo +1.96 check --workspace --all-targets --locked
