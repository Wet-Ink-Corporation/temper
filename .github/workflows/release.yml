name: Release

# Plan step 3.1: the flow the 2.0 port plan defines (§4), so 1.x and 2.0 share it.
#   1. A release PR from branch release/<version> bumps plugin.json, the vendored
#      VERSION and the CHANGELOG (AGENTS.md, release checklist).
#   2. Run this workflow on that branch. `check` runs tests/ci.sh, the manifest
#      validation and tests/release-check.sh --tag v<version>.
#   3. `publish` waits in the protected `release` environment for the owner's
#      approval, then tags v<version> on the checked commit and creates the GitHub
#      release from the CHANGELOG section.
#   4. The owner merges the release PR to `main` with a merge commit, which is
#      what ships to marketplace users. A squash merge would leave the tag off
#      main's history.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z. Run from branch release/X.Y.Z."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Branch and version agree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/release/$VERSION" ]; then
            echo "::error::run this workflow from branch release/$VERSION, not $GITHUB_REF"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release check reads the previous version's tag to see what the
          # release changes.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-28
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Release check (tests/release-check.sh)
        env:
          VERSION: ${{ inputs.version }}
        run: bash tests/release-check.sh --tag "v$VERSION" --notes "$RUNNER_TEMP/notes.md"
      - name: Plugin and marketplace manifests
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate --strict .
      - name: Checks (tests/ci.sh)
        run: bash tests/ci.sh
      - name: Release notes
        id: notes
        run: |
          {
            delim="notes_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
            echo "notes<<$delim"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires the owner's approval. The environment and its required reviewer
    # are set in the repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists; nothing to do"
            exit 0
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "temper $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
